specVersion: 1.0.0
description: >
  Aroma — bonding-curve launchpad on Arc. Indexes token launches, curve
  trading and graduation, with price, market cap and OHLC candles derived at
  index time so the frontend never replays history to render a board.
repository: https://github.com/matco01/Aroma
schema:
  file: ./schema.graphql

dataSources:
  # Launches. Small and append-only — one event per token, ever.
  - kind: ethereum
    name: AromaFactory
    network: arc-testnet
    source:
      address: "0xc11f086E1e45b3589b1F2B95FA8069Bc2a58D772"
      abi: AromaFactory
      startBlock: 60641627
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/factory.ts
      entities: [Token, Account, Protocol]
      abis:
        - name: AromaFactory
          file: ./abis/AromaFactory.json
      eventHandlers:
        - event: TokenCreated(indexed address,indexed address,string,string,string,string,uint256)
          handler: handleTokenCreated

  # All trading. One shared contract for every token's curve, so this is the
  # hot path — every buy and sell in the protocol lands here.
  - kind: ethereum
    name: CurveManager
    network: arc-testnet
    source:
      address: "0xEF036a1167e307b413a7F79AFC7d6A774Df8AC07"
      abi: CurveManager
      startBlock: 60641627
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/curve.ts
      entities: [Token, Trade, Balance, Account, Candle, Protocol]
      abis:
        - name: CurveManager
          file: ./abis/CurveManager.json
      eventHandlers:
        - event: Bought(indexed address,indexed address,address,uint256,uint256,uint256,uint256)
          handler: handleBought
        - event: Sold(indexed address,indexed address,uint256,uint256,uint256,uint256)
          handler: handleSold
        - event: Graduated(indexed address,uint256,uint256,uint256)
          handler: handleGraduated
        - event: CreatorFeesClaimed(indexed address,indexed address,uint256)
          handler: handleCreatorFeesClaimed
