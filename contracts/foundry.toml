[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Deliberately not pinned globally any more. Every contract in src/ pins
# its own pragma to exactly 0.8.28, so their bytecode is unaffected (the
# hash is asserted identical in the commit that made this change), while
# v4-core pins =0.8.26 and cannot compile under a global 0.8.28 pin.
# Letting forge resolve per file is what allows testing against Uniswap's
# real PoolManager instead of a mock of it.
# solc_version = "0.8.28"
# Not pinning evm_version yet — Arc documents its EVM target as "Osaka
# baseline" but that isn't yet a recognized --evm-version value in current
# solc/forge tooling. Leaving this on the toolchain default (a recent,
# widely-supported fork) until Arc's exact opcode support is confirmed
# against a real testnet deploy, rather than guessing a string that might
# silently fall back or fail. Revisit before the first testnet deploy.

# High optimizer runs: this contract is called on every single buy/sell
# (high call frequency) more than it's deployed (once). Optimizing for
# cheap repeated calls over cheap one-time deployment is the right tradeoff
# here, same reasoning most production AMMs use.
optimizer = true
optimizer_runs = 1_000_000

# Deploy-cost-sensitive: the factory deploys a fresh ERC20 on every single
# token launch, so *that* contract's bytecode size/deploy gas matters a lot
# more than a normal one-off deploy. Keep the launched-token contract
# minimal — this is a design constraint on AromaToken.sol, not a toml
# setting, noted here so it isn't lost.

fs_permissions = [{ access = "read", path = "./" }]

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
    # Restored at a real tag - v4.0.0, commit e50237c43811bd9b526eff40f26772152a42daba.
    #
    # The README documents an earlier vendored copy that matched no published
    # tag, which is why lib/ could not be restored from anything public. That
    # copy is gone and this one is identifiable, so a fresh clone builds. Note
    # this is NOT byte-identical to what the deployed LiquidityLocker was
    # compiled against - see the README before redeploying that contract.
    "v4-core/=lib/v4-core/src/",
]

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
# Arc mainnet (5042) does exist, and Uniswap v3 and v4 are both deployed on
# it — 2026-09-16 is the *public* launch, not the chain's first block. But
# Circle has not published a public mainnet RPC ("mainnet endpoints and
# parameters are published separately when available"), and the third-party
# chainlists do not carry it yet: dRPC and 1rpc both answer "unknown
# network". So this resolves through a variable rather than a URL, and the
# variable has to come from a provider account for now.
#
# The pool system in src/pool/ has no testnet path at all — Uniswap is not
# deployed on Arc testnet at any version — so this endpoint, or a local
# fork, is the only way to exercise it.
arc_mainnet = "${ARC_MAINNET_RPC_URL}"

[etherscan]
# Arc's block explorer (Arcscan) verification support — endpoint/API key
# unconfirmed as of writing. Fill in once verified; until then `forge
# verify-contract` for Arc will need to be checked against Arcscan's actual
# docs rather than assumed to be Etherscan-compatible.
arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
