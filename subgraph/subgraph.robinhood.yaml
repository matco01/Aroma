specVersion: 1.0.0
description: >
  Aroma on Robinhood Chain — invite-only club coins settled in USDG, each
  launched by winning a 24-hour Club auction. Same schema as the Arc
  manifests; the club-usdg mappings write the same Token/Trade/Balance/
  Candle/Protocol entities the Arc pool system does, so the board, the API
  and the DEX Screener adapter work unchanged.
repository: https://github.com/matco01/Aroma
schema:
  file: ./schema.graphql

# FIXME: the network slug for Robinhood Chain (chain id 4663) as Graph
# Node/Goldsky identify it has not been confirmed — this is a placeholder,
# not a guess to deploy against. Check Goldsky's supported-networks list (or
# ask them directly) before using this manifest for anything real. It cannot
# be "arc" or "arc-testnet": every dataSource in one manifest must share a
# network, the same reason subgraph.pool.yaml is a separate file from
# subgraph.yaml, and this is a different chain from both.
dataSources:
  # Launches. One event per club coin, ever, always from a finalized auction.
  - kind: ethereum
    name: ClubFactoryUsdg
    network: robinhood # FIXME: confirm the real network slug
    source:
      # FIXME: fill in from DeployRobinhood.s.sol's output.
      address: "0x0000000000000000000000000000000000000000"
      abi: ClubFactoryUsdg
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/club-usdg.ts
      entities: [Token, Account, Protocol, PoolRef]
      abis:
        - name: ClubFactoryUsdg
          file: ./abis/ClubFactoryUsdg.json
      eventHandlers:
        - event: TokenCreated(indexed address,indexed address,indexed bytes32,string,string,string,string,uint256)
          handler: handleTokenCreated

  # All trading. Same singleton-PoolManager caveat as subgraph.pool.yaml:
  # every swap in every v4 pool on Robinhood Chain arrives here, and
  # handleSwap discards everything that isn't ours via a PoolRef lookup.
  #
  # startBlock matters more than usual — left at PoolManager's own deployment
  # it replays every unrelated v4 swap on the whole chain before reaching
  # anything of ours. Set it to the block ClubVaultUsdg was deployed in.
  - kind: ethereum
    name: PoolManager
    network: robinhood # FIXME: confirm the real network slug
    source:
      # Uniswap v4's PoolManager on Robinhood Chain, confirmed to have code
      # on both mainnet (4663) and testnet (46630).
      address: "0x8366a39cc670b4001a1121b8f6a443a643e40951"
      abi: PoolManager
      # FIXME: the block ClubVaultUsdg was deployed in.
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/club-usdg.ts
      entities: [Token, Trade, Balance, Account, Candle, Protocol, PoolRef]
      abis:
        - name: PoolManager
          file: ./abis/PoolManager.json
      eventHandlers:
        - event: Swap(indexed bytes32,indexed address,int128,int128,uint160,uint128,int24,uint24)
          handler: handleSwap

  # Fees. The hook's own events are the authority on what was charged and
  # who it was credited to — see pool.ts's header for why the Swap event's
  # amounts alone can't settle it.
  - kind: ethereum
    name: ClubVaultUsdg
    network: robinhood # FIXME: confirm the real network slug
    source:
      # FIXME: fill in from DeployRobinhood.s.sol's output. Mined, so it is
      # neither guessable nor stable across redeploys.
      address: "0x0000000000000000000000000000000000000000"
      abi: ClubVaultUsdg
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/club-usdg.ts
      entities: [Token, Protocol]
      abis:
        - name: ClubVaultUsdg
          file: ./abis/ClubVaultUsdg.json
      eventHandlers:
        - event: FeeTaken(indexed address,indexed address,uint256)
          handler: handleFeeTaken
        - event: Credited(indexed address,indexed address,uint8,uint256)
          handler: handleCredited

  # The auction itself — one Club at a time, gating every launch.
  - kind: ethereum
    name: ClubAuction
    network: robinhood # FIXME: confirm the real network slug
    source:
      # FIXME: fill in from DeployRobinhood.s.sol's output.
      address: "0x0000000000000000000000000000000000000000"
      abi: ClubAuction
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/club-auction.ts
      entities: [Club, ClubBid, Token]
      abis:
        - name: ClubAuction
          file: ./abis/ClubAuction.json
      eventHandlers:
        - event: ClubOpened(indexed uint256,uint64)
          handler: handleClubOpened
        - event: ClubBid(indexed uint256,indexed address,uint256,uint256,uint64)
          handler: handleClubBid
        - event: ClubDraftUpdated(indexed uint256,indexed address,string,string,string,string)
          handler: handleClubDraftUpdated
        - event: ClubLaunched(indexed uint256,indexed address,indexed address,uint256,uint256)
          handler: handleClubLaunched
        - event: ClubVoided(indexed uint256)
          handler: handleClubVoided
